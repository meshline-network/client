name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Preserve queued versions and let an earlier run finish publishing first.
concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  version:
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      needed: ${{ steps.release.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $version = & dotnet msbuild src/Meshline.Cli/Meshline.Cli.csproj -nologo -getProperty:Version -p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { throw 'Could not read project version' }
          $version = "$version".Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Project version is empty' }
          $tag = "v$version"
          & git check-ref-format "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Invalid release tag: $tag" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Check for an existing release
        id: release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            // Listing with write access also finds drafts left by interrupted uploads.
            for await (const page of github.paginate.iterator(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100
            })) {
              const release = page.data.find(release => release.tag_name === tag);
              if (!release) continue;
              if (release.draft) {
                throw new Error(`Draft release ${tag} already exists. Complete or delete the draft before rerunning.`);
              }
              core.notice(`Release ${tag} already exists; skipping publication.`);
              core.setOutput('needed', 'false');
              return;
            }
            core.setOutput('needed', 'true');

  verify:
    needs: version
    if: needs.version.outputs.needed == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [version, verify]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check tag target
        shell: pwsh
        run: |
          $tagCommit = & git rev-parse --verify --quiet "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -eq 0) {
            if ("$tagCommit".Trim() -ne $env:GITHUB_SHA) {
              throw "Tag $env:RELEASE_TAG already points to a different commit; refusing to publish mismatched binaries"
            }
          } elseif ($LASTEXITCODE -ne 1) {
            throw 'Could not inspect release tag'
          }
          # A missing tag is expected; gh will create it at GITHUB_SHA.
          $global:LASTEXITCODE = 0
      - name: Package Windows and Linux
        shell: pwsh
        run: ./scripts/Publish.ps1
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "artifacts/meshline-$env:RELEASE_VERSION-win-x64.zip",
            "artifacts/meshline-$env:RELEASE_VERSION-linux-x64.tar.gz",
            'artifacts/SHA256SUMS'
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset: $asset" }
          }
          $options = @('--repo', $env:GITHUB_REPOSITORY, '--target', $env:GITHUB_SHA, '--title', $env:RELEASE_TAG, '--generate-notes')
          if ($env:RELEASE_VERSION.Split('+')[0].Contains('-')) { $options += '--prerelease' }
          & gh release create $env:RELEASE_TAG @assets @options
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed' }
